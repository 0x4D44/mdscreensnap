[package]
name = "mdscreensnap"
version = "0.1.0"
edition = "2021"
description = "A simple command-line screenshot tool for Windows and WSL"
license = "MIT"
authors = ["0x4D44"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"
regex = "1.10"

[[bin]]
name = "mdscreensnap"
path = "src/main.rs"
