[package]
name = "mdscreensnap"
version = "0.1.0"
edition = "2021"
description = "A simple command-line screenshot tool for Windows and WSL"
license = "MIT"
authors = ["0x4D44"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
anyhow = "1.0"
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }

[[bin]]
name = "mdscreensnap"
path = "src/main.rs"
